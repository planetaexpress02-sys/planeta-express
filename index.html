<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Planeta Express — Sistema de Gestão</title>
  <meta name="theme-color" content="#0b1424">
  <meta name="description" content="Sistema de Gestão Operacional — Planeta Express Transportes">
  <!-- Celular / instalável -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Planeta Express">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/logo.png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="stylesheet" href="assets/estilo.css?v=108">
  <link rel="stylesheet" href="assets/estilo2.css?v=108">
</head>
<body>
  <!-- SPLASH / ABERTURA -->
  <div id="splash">
    <div class="sp-orb sp-orb1"></div>
    <div class="sp-orb sp-orb2"></div>
    <div class="sp-grid"></div>
    <div class="sp-core">
      <div class="sp-logo"><img src="assets/logo.png" alt="Planeta Express"><i class="sp-shine"></i></div>
      <div class="sp-title">PLANETA<b>EXPRESS</b></div>
      <div class="sp-line"></div>
      <div class="sp-tag">Sistema de Gestão Operacional</div>
      <div class="sp-loader"><span></span></div>
    </div>
  </div>

  <!-- Cabeçalho que aparece só na impressão / PDF do relatório -->
  <div id="printHead" class="print-only"></div>

  <div class="app">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="brand">
        <div class="logo-badge"><img src="assets/logo.png" alt="Planeta Express"></div>
        <div class="btxt"><b>PLANETA</b><span>Express</span></div>
      </div>
      <button class="rail-toggle no-print" onclick="toggleRail()" title="Recolher menu" aria-label="Recolher ou expandir o menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <nav class="nav" id="nav"></nav>
      <div class="foot">Sistema de Gestão Operacional<br><b>v6.47</b> · dados locais e seguros</div>
    </aside>
    <div class="scrim" id="scrim" onclick="closeSidebar()"></div>

    <!-- MAIN -->
    <div class="main">
      <header class="topbar">
        <button class="menu-toggle no-print" onclick="toggleSidebar()" aria-label="Abrir menu">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <button class="back-btn no-print" onclick="navVoltar()" title="Voltar" aria-label="Voltar">
          <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <a class="tb-brand no-print" href="#inicio" aria-label="Início — Planeta Express">
          <span class="tb-logo"><img src="assets/logo.png" alt=""></span><span class="tb-word">PLANETA EXPRESS</span>
        </a>
        <div class="page-title" id="pageTitle">Painel de Controle</div>
        <button class="cock-search no-print" id="cockSearch" onclick="pexCmdOpen()" title="Busca global e comandos (Ctrl + K)">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m21 21-4.3-4.3" stroke="currentColor" stroke-width="2"/></svg>
          <span>Buscar placa, motorista, CT-e, nota, viagem…</span>
          <kbd class="cock-kbd">Ctrl K</kbd>
        </button>
        <div class="cock-cluster no-print">
          <button class="cock-ico" id="cockNew" onclick="pexCmdOpen('new')" title="Ações rápidas (Ctrl + N)" aria-label="Ações rápidas">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button class="cock-ico" id="cockBell" onclick="pexNotifToggle(event)" title="Central de notificações" aria-label="Notificações">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
            <span class="cock-badge" id="cockBadge"></span>
          </button>
          <div class="cock-weather" id="cockWeather"></div>
          <div class="cock-clock" title="Data e hora"><b id="cockTime">--:--:--</b><span id="cockDate"></span></div>
          <div class="cock-status on" id="cockStatus"><i></i><span>Online</span></div>
          <button class="btn sm relbtn" onclick="imprimirRelatorio()" title="Tirar relatório desta tela (imprimir ou salvar em PDF)">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 9V3h12v6M6 18H4v-6h16v6h-2M8 14h8v7H8z"/></svg><span>Relatório</span>
          </button>
          <div class="userbadge" id="userbadge"></div>
        </div>
      </header>
      <main class="content" id="view" style="transition:opacity .18s"></main>
    </div>
  </div>

  <div class="overlay" id="overlay"></div>
  <div id="loginScreen" class="login-screen"></div>
  <div class="toasts" id="toasts"></div>

  <!-- Biblioteca da nuvem (só é usada no modo online; offline funciona sem ela) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="assets/config-online.js?v=57"></script>
  <script src="assets/nuvem.js?v=57"></script>

  <!-- Leitura de apólices: pdf.js (texto) + Tesseract (OCR de PDFs/imagens escaneados). Só quando há internet; sem elas o sistema degrada para o leitor interno. -->
  <script defer src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js"></script>

  <script src="assets/viagens.js?v=108"></script>
  <script src="assets/dados.js?v=108"></script>
  <script src="assets/alarmes.js?v=108"></script>
  <script src="assets/arquivos.js?v=108"></script>
  <script src="assets/importar.js?v=108"></script>
  <script src="assets/app.js?v=108"></script>
  <script src="assets/assistente.js?v=108"></script>
  <script>
    /* Modo app offline + atualização automática (sem ficar preso em versão antiga) */
    if(location.protocol.startsWith('http') && 'serviceWorker' in navigator){
      var _pexRefreshing=false;
      navigator.serviceWorker.addEventListener('controllerchange', function(){ if(_pexRefreshing) return; _pexRefreshing=true; location.reload(); });
      navigator.serviceWorker.register('service-worker.js').then(function(reg){
        try{ reg.update(); }catch(e){}
        setInterval(function(){ try{ reg.update(); }catch(e){} }, 60000); /* verifica atualização a cada 1 min */
        reg.addEventListener('updatefound', function(){
          var nw = reg.installing;
          if(nw){ nw.addEventListener('statechange', function(){
            if(nw.state==='installed' && navigator.serviceWorker.controller && !_pexRefreshing){ _pexRefreshing=true; location.reload(); }
          }); }
        });
      }).catch(function(){});
    }
  </script>
</body>
</html>
